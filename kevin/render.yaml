services:
  - type: web
    name: potholeiq-api
    runtime: python
    rootDir: kevin
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn kevin.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app   # update after Vercel deploy
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALERT_RISK_THRESHOLD
        value: "75.0"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false        # set manually in Render dashboard
      - key: SMTP_PASS
        sync: false        # set manually in Render dashboard
      - key: ALERT_EMAIL_TO
        value: dot.notifications@nyc.gov
    healthCheckPath: /
